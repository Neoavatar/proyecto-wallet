<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera - Depositar</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div class="card shadow-sm p-4 wallet-card">
    <h2 class="text-center mb-4">Depositar</h2>
    <!-- Alerta -->
    <div id="alert_placeholder"></div>

    <!-- Saldo Actual -->
    <div class="text-center mb-0 texto-centrado">
      <p class="text-muted mb-1">Saldo Actual</p>
      <h1 id="saldo_actual" class="display-5 fw-bold texto-animado">$0</h1>
    </div>

    <!-- NUEVO: Leyenda del monto depositado (aparece después de depositar) -->
    <div id="leyenda_deposito" class="text-center text-success fw-bold mt-0" style="display: none;"></div>

    <form id="form_deposito">
      <!-- Campo Monto -->
      <div class="mb-3">
        <label for="monto_deposito" class="form-label">Monto a depositar</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input type="number" class="form-control form-control-lg" id="monto_deposito" placeholder="0" min="0">
        </div>
      </div>
      
      <!-- Botones de Acción -->
      <div class="d-grid gap-2 mt-4">
        <!-- botón depósito y te regresa al menú -->
        <button type="submit" id="btn_realizar_deposito" class="btn btn-primary">Realizar Depósito</button>
        <a href="" id="btn_menu" class="btn btn-secondary">Volver al Menú</a>
      </div>      

      <!-- Botón de Cerrar Sesión -->
      <div class="d-grid mt-4">
        <a href="" id="btn_logout" class="btn btn-link text-danger">Cerrar Sesión</a>
      </div>
    </form>
  </div>

  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
