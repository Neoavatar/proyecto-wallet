<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar Dinero</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Link a Bootstrap ICONS 1.13.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="wallet-card fade-in">
    <div class="header-simple">
      <a href="#" id="btn_menu" class="btn-volver"><i class="bi bi-arrow-left"></i></a>
      <h2>Depositar</h2>
    </div>
    <div class="contenido-app d-flex flex-column">
      <div id="alert_placeholder"></div>
      <div id="leyenda_deposito" class="alert alert-success border-0 rounded-4 text-center mt-2 py-2" style="display: none; font-size: 0.9rem;"></div>
      <div class="header-app">
        <p>Saldo Disponible</p>
        <h1 id="saldo_actual">$0</h1>
      </div>
      <form id="form_deposito" class="flex-grow-1 d-flex flex-column">
        <label class="form-label fw-bold text-muted small">Monto a cargar</label>
          <div class="input-group mb-4">
            <span class="input-group-text bg-transparent border-0 fs-2 fw-bold">$</span>            
            <input type="number" class="form-control border-0 fs-1 fw-bold mx-auto" id="monto_deposito" 
            placeholder="0">
          </div>
          <label class="form-label text-muted small mb-2">Selección Rápida</label>
          <div class="grid-montos">
            <button type="button" class="btn btn-monto" onclick="sumarMonto(1000)">+$1.000</button>
            <button type="button" class="btn btn-monto" onclick="sumarMonto(5000)">+$5.000</button>
            <button type="button" class="btn btn-monto" onclick="sumarMonto(10000)">+$10.000</button>
          </div>
          <div class="mt-auto pt-3">
            <button type="submit" id="btn_realizar_deposito" class="btn btn-primary w-100 btn-lg shadow-sm">
              <i class="bi bi-wallet2 me-2"></i> Confirmar Recarga
            </button>
          </div>
        </form>
    </div>
  </div>
  

  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
