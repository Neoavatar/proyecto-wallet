<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar Dinero</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Link a Bootstrap ICONS 1.13.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="wallet-card justify-content-center p-4 fade-in">
    <div class="p-4">
      <div class="text-center mb-5">
        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; background-color: var(--color-principal) !important;">
          <i class="bi bi-wallet2 fs-1"></i>
        </div>
        <h2 class="fw-bold" style="color: var(--color-principal);">Alke Wallet</h2>
      </div>

      <div id="alert_placeholder"></div>

      <form id="login_form">
        <div class="mb-3">
          <label for="email" class="form-label text-muted small ms-2">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text border-0 bg-transparent"><i class="bi bi-envelope text-primary"></i></span>
            <input type="email" class="form-control" id="email" placeholder="user@test.com" required>
          </div>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label text-muted small ms-2">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text border-0 bg-transparent"><i class="bi bi-lock text-primary"></i></span>
            <input type="password" class="form-control" id="password" placeholder="pass123" required>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary shadow-sm">Ingresar</button>
        </div>
      </form>
      
      <div class="text-center mt-4">
        <small class="text-muted">¿Olvidaste tu contraseña?</small>
      </div>
    </div>
  </div>

  
  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
