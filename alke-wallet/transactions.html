<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Movimientos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div class="wallet-card fade-in">
    
    <div class="header-simple border-bottom">
        <a href="#" id="btn_menu" class="btn-volver"><i class="bi bi-arrow-left"></i></a>
        <h2>Movimientos</h2>
    </div>

    <div class="contenido-app pt-3">
        <div id="alert_placeholder"></div>

        <div class="d-flex align-items-center gap-2 mb-4">
            <i class="bi bi-funnel text-muted"></i>
            <select id="filtro_tipo" class="form-select form-select-sm rounded-pill border-0 bg-light text-muted fw-bold">
                <option value="todos">Todos los movimientos</option>
                <option value="deposito">Depósitos</option>
                <option value="compra">Compras</option>
                <option value="pago">Pagos de Servicios</option>
                <option value="transferencia">Transferencias</option>
            </select>
        </div>

        <ul id="lista_movimientos" class="list-group list-group-flush">
            </ul>

        <div id="mensaje_sin_movimientos" class="text-center mt-5 text-muted" style="display: none;">
            <div class="mb-3">
                <i class="bi bi-receipt fs-1 opacity-25"></i>
            </div>
            <p>No se encontraron movimientos con este filtro.</p>
        </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="./assets/js/script.js"></script>
</body>
</html>
