<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar Dinero</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Link a Bootstrap ICONS 1.13.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="wallet-card fade-in">
    <div class="header-simple border-bottom">
      <a href="#" id="btn_menu" class="btn-volver"><i class="bi bi-arrow-left"></i></a>
      <h2>Movimientos</h2>
    </div>
    <div class="contenido-app pt-3">
      <div id="alert_placeholder"></div>
      <div class="d-flex align-items-center gap-2 mb-4">
        <i class="bi bi-funnel text-muted"></i>
        <select id="filtro_tipo" class="form-select form-select-sm rounded-pill border-0 bg-light text-muted fw-bold">
          <option value="todos">Todos los movimientos</option>
          <option value="deposito">Depósitos</option>
          <option value="compra">Compras</option>
          <option value="pago">Pagos</option>
          <option value="transferencia">Transferencias</option>
        </select>
      </div>
      <ul id="lista_movimientos" class="list-group list-group-flush"></ul>
      <div id="mensaje_sin_movimientos" class="text-center mt-5 text-muted" style="display: none;">
        <div class="mb-3">
          <i class="bi bi-receipt fs-1 opacity-25"></i>
        </div>
        <p>No se encontraron movimientos con este filtro.</p>
      </div>
    </div>
  </div>
  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
