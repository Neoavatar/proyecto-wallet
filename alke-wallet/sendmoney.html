<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera - Enviar Dinero</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div class="card shadow-sm p-4 wallet-card">
    <h2 class="text-center mb-4">Enviar Dinero</h2>
    <!-- Alerta -->
    <div id="alert_placeholder"></div>
    
    <!-- Formulario de Búsqueda -->
    <form class="mb-3">
      <label for="searchContact" class="form-label">Buscar en la agenda</label>
      <div class="input-group">
        <input type="text"  id="buscar_contacto" class="form-control" placeholder="Nombre, Apellido, CBU o Alias">
        <button type="button" class="btn btn-outline-secondary" id="btn_buscar">Buscar</button>
      </div>
    </form>

    <!-- Botón para Agregar Contacto (abre el modal) -->
    <div class="d-grid mb-3">
      <button type="button" id="btn_mostrar_form_contacto" class="btn btn-outline-primary">
        + Agregar Nuevo Contacto
      </button>
    </div>

    <!-- 3. FORMULARIO DE NUEVO CONTACTO (Oculto por defecto con style="display: none;") -->
    <div id="form_nuevo_contacto" class="card p-3 mb-3 bg-light border-primary" style="display: none;">
        <h6 class="mb-3">Nuevo Contacto</h6>
        <form id="form_agregar_contacto">
            <div class="mb-2">
              <label for="info_nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="info_nombre">
            </div>
            <div class="mb-2">
              <label for="info_apellido" class="form-label">Apellido</label>
              <input type="text" class="form-control" id="info_apellido">
            </div>
            <div class="mb-2">
              <label for="info_cbu" class="form-label">CBU</label>
              <input type="number" class="form-control" id="info_cbu">
            </div>
            <div class="mb-2">
              <label for="info_alias" class="form-label">Alias</label>
              <input type="text" class="form-control" id="info_alias">
            </div>
            <div class="mb-2">
              <label for="info_banco" class="form-label">Banco</label>
              <input type="text" class="form-control" id="info_banco">
            </div>
            <div class="d-flex justify-content-end gap-2 mt-3">
                <button type="button" id="btn_cancelar_contacto" class="btn btn-sm btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-sm btn-primary">Guardar</button>
            </div>
        </form>
    </div>


    <!-- Lista de Contactos -->
    <h5 class="mt-4">Contactos Guardados</h5>
    <div id="lista_contactos" class="list-group list-group-flush">
      <a href="#" class="list-group-item list-group-item-action contacto_item">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1 nombre_contacto">Juan Perez</h6>
        </div>
        <div class="d-flex w-100 justify-content-between">
          <small class="text-muted">CBU: <span class="cbu_contacto text-muted">123456789</span></small>
        </div>
        <div class="d-flex w-100 justify-content-between">
          <small class="text-muted">Banco: <span class="banco_contacto text-muted">Banco Estado</span></small>
        </div>
        <div class="d-flex w-100 justify-content-between">
          <small class="text-muted">Alias: <span class="alias_contacto text-muted">juanito</span></small>
        </div>
      </a>
      <a href="#" class="list-group-item list-group-item-action contacto_item">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1 nombre_contacto">Perico Los Palotes</h6>
        </div>
        <div class="d-flex w-100 justify-content-between">
          <small class="text-muted">CBU: <span class="cbu_contacto text-muted">987654321</span></small>
        </div>
        <div class="d-flex w-100 justify-content-between">
          <small class="text-muted">Banco: <span class="banco_contacto text-muted">Banco Santander</span></small>
        </div>
        <div class="d-flex w-100 justify-content-between">
          <small class="text-muted">Alias: <span class="alias_contacto text-muted">perico</span></small>
        </div>
      </a>
    </div>
<!--
    <div class="mt-4 mb-3">
      <label for="montoEnvio" class="form-label">Monto a transferir</label>
      <div class="input-group">
        <span class="input-group-text">$</span>
        <input type="number" id="montoEnvio" class="form-control" placeholder="0" min="0">
      </div>
    </div>
-->
    <!-- 5. SECCIÓN DE ENVÍO (Oculta hasta seleccionar contacto) -->
    <div id="seccion_envio" class="mt-4 border-top pt-3" style="display: none;">
        <h5 class="text-primary">Transferir a: <span id="nombre_contacto_seleccionado" class="fw-bold"></span></h5>
        <div class="mb-3">
            <label for="monto_envio" class="form-label">Monto a transferir</label>
            <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" id="monto_envio" placeholder="0" min="0">
            </div>
        </div>
        <div class="d-grid">
            <button type="button" id="btn_realizar_envio" class="btn btn-primary">Confirmar Envío</button>
        </div>
    </div>

    <!-- MENSAJE DE CONFIRMACIÓN FINAL (Oculto) -->
    <div id="mensaje_confirmacion" class="alert alert-success mt-4 text-center" style="display: none;" role="alert">
        <h4 class="alert-heading">¡Envío Exitoso!</h4>
        <p>Tu transferencia se ha realizado correctamente.</p>
    </div>

    <!-- Botón de Volver -->
    <div class="d-grid mt-4">
      <a href="" id="btn_menu" class="btn btn-secondary">Volver al Menú</a>
    </div>

    <!-- Botón de Cerrar Sesión -->
    <div class="d-grid mt-4">
      <a href="" id="btn_logout" class="btn btn-link text-danger">Cerrar Sesión</a>
    </div>
  </div>

  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
