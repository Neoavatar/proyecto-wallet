<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar Dinero</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Link a Bootstrap ICONS 1.13.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="wallet-card fade-in">
    <div class="header-simple">
      <a href="#" id="btn_menu" class="btn-volver"><i class="bi bi-arrow-left"></i></a>
      <h2>Enviar Dinero</h2>
    </div>
    <div class="contenido-app">
      <div id="alert_placeholder"></div>
      <div class="position-relative mb-4">
          <input type="text" id="buscar_contacto" class="form-control ps-5" placeholder="Buscar contacto...">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="text-muted m-0">Contactos</h6>
          <button id="btn_mostrar_form_contacto" class="btn btn-sm btn-outline-primary rounded-pill">
            <i class="bi bi-plus-lg"></i> Nuevo
          </button>
      </div>
      <div id="form_nuevo_contacto" class="card border-0 shadow-sm p-3 mb-3 bg-white rounded-4" style="display: none;">
        <form id="form_agregar_contacto">
          <input type="text" class="form-control form-control-sm mb-2" id="info_nombre" placeholder="Nombre">
          <input type="text" class="form-control form-control-sm mb-2" id="info_apellido" placeholder="Apellido">
          <input type="number" class="form-control form-control-sm mb-2" id="info_cbu" placeholder="CBU">
          <input type="text" class="form-control form-control-sm mb-2" id="info_alias" placeholder="Alias">
          <input type="text" class="form-control form-control-sm mb-2" id="info_banco" placeholder="Banco">
          <div class="text-end">
            <button type="button" id="btn_cancelar_contacto" class="btn btn-sm btn-light rounded-pill">Cancelar</button>
            <button type="submit" class="btn btn-sm btn-primary rounded-pill">Guardar</button>
          </div>
        </form>
      </div>

      <div id="lista_contactos" class="list-group list-group-flush mb-4"></div>
      <div id="seccion_envio" class="text-center mt-auto" style="display: none;">
        <hr>
          <p class="text-muted mb-1">Enviando a <strong id="nombre_contacto_seleccionado" class="text-primary"></strong></p>
          <div class="input-group mb-3">
            <span class="input-group-text bg-transparent border-0 fs-1 fw-bold">$</span>
            <input type="number" class="form-control border-0 fs-1 fw-bold mx-auto" id="monto_envio" 
            placeholder="0">
          </div>
          <button type="button" id="btn_realizar_envio" class="btn btn-primary w-100 py-3 rounded-pill">
            Confirmar Transferencia
          </button>
      </div>
        
        <div id="mensaje_confirmacion" class="text-center mt-5" style="display: none;">
            <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-check-lg fs-2"></i>
            </div>
            <h4>¡Enviado!</h4>
        </div>
    </div>
  </div>

  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
