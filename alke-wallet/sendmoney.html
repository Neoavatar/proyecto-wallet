<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera - Enviar Dinero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div class="card shadow-sm p-4 wallet-card">
    <h2 class="text-center mb-4">Enviar Dinero</h2>
    
    <!-- Formulario de Búsqueda -->
    <form class="mb-3">
      <label for="searchContact" class="form-label">Buscar en la agenda</label>
      <div class="input-group">
        <input type="text" class="form-control" id="searchContact" placeholder="Nombre, CBU o Alias">
        <button class="btn btn-outline-secondary" type="button" id="button-search">Buscar</button>
      </div>
    </form>

    <!-- Botón para Agregar Contacto (abre el modal) -->
    <div class="d-grid mb-3">
      <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addContactModal">
        + Agregar Nuevo Contacto
      </button>
    </div>

    <!-- Lista de Contactos -->
    <h5 class="mt-4">Contactos Guardados</h5>
    <div class="list-group list-group-flush">
      <a href="#" class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1">John Doe</h6>
        </div>
        <small class="text-muted">CBU: 123456789 - ABC Bank</small>
      </a>
      <a href="#" class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1">Jane Smith</h6>
        </div>
        <small class="text-muted">Alias: jane.smith - XYZ Bank</small>
      </a>
    </div>

    <!-- Botón Depositar (Seleccionar y Depositar)-->
    <div class="d-grid mt-4">
      <a href="./deposit.html" class="btn btn-primary">Enviar Dinero</a>
    </div>
    <!-- Botón de Volver -->
    <div class="d-grid mt-4">
      <a href="./menu.html" class="btn btn-secondary">Volver al Menú</a>
    </div>

    <!-- Botón de Salir -->
    <div class="d-grid mt-4">
      <a href="./login.html" class="btn btn-link text-danger">Cerrar Sesión</a>
    </div>
  </div>

  <!-- Modal para Agregar Nuevo Contacto -->
  <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addContactModalLabel">Agregar Nuevo Contacto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Formulario dentro del modal -->
          <form>
            <div class="mb-3">
              <label for="contactName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="contactName">
            </div>
            <div class="mb-3">
              <label for="contactCbu" class="form-label">CBU o Alias</label>
              <input type="text" class="form-control" id="contactCbu">
            </div>
            <div class="mb-3">
              <label for="contactBank" class="form-label">Banco</label>
              <input type="text" class="form-control" id="contactBank">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <!-- Este botón guardaría el contacto (y cerraría el modal) -->
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Guardar Contacto</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
