<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar Dinero</title>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Link a Bootstrap ICONS 1.13.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="wallet-card fade-in p-4">
    <div class="p-4">
      <div class="header-app">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-4"></i>
            <span>Hola, Israel</span>
          </div>
        </div>
        <p>Saldo Disponible</p>
        <h1 id="saldo_actual">$0</h1>
      </div>
      <div class="contenido-app">
        <div id="alert_placeholder"></div>
          <h6 class="text-muted mb-3 ps-1">Acciones Rápidas</h6>
          <div class="grid-acciones">
            <a href="#" id="btn_deposito" class="accion-item">
              <i class="bi bi-wallet2 icono-grande"></i>
              <small>Depositar</small>
            </a>
            <a href="#" id="btn_enviar" class="accion-item">
              <i class="bi bi-send icono-grande"></i>
              <small>Enviar</small>
            </a>
            <a href="#" id="btn_transacciones" class="accion-item">
              <i class="bi bi-clock-history icono-grande"></i>
              <small>Historial</small>
            </a>
          </div>
          <div class="text-center mt-auto">
            <a href="#" id="btn_logout" class="text-danger text-decoration-none small">
              <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
          </div>
      </div>
    </div>    
  </div>

  <!-- Link a Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Link a JQuery 3.x -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- Link a JQuery propios -->
  <script src="./assets/js/script.js"></script>
</body>
</html>
