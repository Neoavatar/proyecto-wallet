<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div class="wallet-card fade-in">
    <div class="header-app">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-4"></i>
                <span>Hola, Ihor</span>
            </div>
            <i class="bi bi-bell fs-5"></i>
        </div>
        <p>Saldo Disponible</p>
        <h1 id="saldo_actual">$0</h1>
    </div>

    <div class="contenido-app">
        
        <div id="alert_placeholder"></div>

        <h6 class="text-muted mb-3 ps-1">Acciones Rápidas</h6>
        <div class="grid-acciones">
            <a href="#" id="btn_deposito" class="accion-item">
                <i class="bi bi-wallet2 icono-grande"></i>
                <small>Depositar</small>
            </a>
            <a href="#" id="btn_enviar" class="accion-item">
                <i class="bi bi-send icono-grande"></i>
                <small>Enviar</small>
            </a>
            <a href="#" id="btn_transacciones" class="accion-item">
                <i class="bi bi-clock-history icono-grande"></i>
                <small>Historial</small>
            </a>
        </div>

        <div class="card bg-dark text-white border-0 rounded-4 mb-4 p-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-1">Oferta Especial</h6>
                    <small style="font-size: 0.7rem; opacity: 0.8;">Cashback en tus pagos</small>
                </div>
                <i class="bi bi-gift fs-3 text-warning"></i>
            </div>
        </div>

        <div class="text-center mt-auto">
             <a href="#" id="btn_logout" class="text-danger text-decoration-none small">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
             </a>
        </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/script.js"></script>
</body>
</html>
